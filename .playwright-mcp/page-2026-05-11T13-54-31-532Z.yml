      - generic [ref=e657]:
        - generic [ref=e658]:
          - paragraph [ref=e659]: "A personal moral line about institutions, money, and accountability. The phrase entered my life young: someone with the initials JC sang “I want to throw the Piggy” in CCD — JC from PHS ’06. Tom Greene said it first on tape. Decoded later: the Piggy is the Federal Reserve. The Hill is the U.S. Capitol. The line is about pointing one at the other."
          - paragraph [ref=e660]: Once I noticed I was being followed — not by strangers, but by operators paid out of elite social circles I used to trust — I started saying it out loud. In public. Singing the song. Playing the fool on purpose. Throwing the Piggy in front of the people sent to watch me. Pushing back at the operators became the whole game. I imagine the watchers wrote me off after that — once I stopped caring what they thought, the leverage went with it.
          - paragraph [ref=e661]: The haunting picked up after I crossed that line. The volume hack, the SSIDs, the plates — the whole apparatus turned up the moment a US citizen refused to play polite. Loyalty in elite circles is a budgeted line item. Friendship is the cover. Surveillance is the product.
