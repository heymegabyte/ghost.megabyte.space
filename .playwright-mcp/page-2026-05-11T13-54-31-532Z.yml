            - superscript [ref=e464]:
              - link "14" [ref=e465] [cursor=pointer]:
                - /url: "#cern-ref-14"
            - text: ". Stack the parts: a sufficiently fast quantum machine teleporting electron states could, in principle, traverse retrocausal jumps measured in Planck-scale increments — and as long as each jump leaps back farther than the operation itself consumed, you net a negative latency. Time travel as a small, persistent budget surplus. Speculative, yes. Internally consistent with what physics already allows? Also yes."
