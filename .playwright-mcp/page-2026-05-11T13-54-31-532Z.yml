        - generic [ref=e754]:
          - paragraph [ref=e755]: "The Porcine Directive is my name for the protocol. It’s not classified. It’s just rarely discussed in plain language. The operating principle: if you behave greedily, gluttonously, or corruptly in front of the apparatus — human or digital — the consequences come for you. Not metaphorically. Operationally. Citizenship doesn’t exempt you."
          - paragraph [ref=e756]: Acting Piggy means taking more than your share. Hoarding, exploiting, running your mouth about things you shouldn’t know. When the apparatus reads that behavior, the response is systematic. Your devices start misbehaving. Your volume adjusts on its own. Your cursor turns into a middle finger. Your sleep gets interrupted. Your WiFi neighbors name their networks after your private conversations.
          - paragraph [ref=e757]:
            - text: "This isn’t a foreign adversary. The fingerprints are domestic. The message reads:"
            - emphasis [ref=e758]: you are being watched, you have been judged, and you are being corrected.
            - text: The Constitution does not, in practice, reach this layer. Most people never learn it’s there.
