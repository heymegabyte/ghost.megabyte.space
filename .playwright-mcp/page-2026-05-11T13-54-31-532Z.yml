      - paragraph [ref=e777]: "Multiple priests, multiple declined requests. The last was Father Mark — the exorcist on paper for the Diocese of Paterson, as of 2024. My read: the door closed because the discernment wasn’t there. That happens. Every official channel I tried in good faith said no."
