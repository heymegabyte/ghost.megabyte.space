          - paragraph [ref=e566]: I was probably already being watched in some way. Things kicked into high gear when I used a stack of iron washers to calibrate a 400 V negative square-wave pulser, wired to two different piezoelectric ultrasound shear-wave transducers, plus high-amperage solenoids and stepper motors running advanced electrical-angle rotation — all of it possibly never grounded properly.
          - paragraph [ref=e567]: During the iron-washer calibration the system went into a resonant state. The voltage on the oscilloscope didn’t plateau — it climbed over time. The wider I opened the gap in the piezo circuit, the more the circuit seemed to grow in power. At one point the only thought I had was, “I think I have found God.”
          - paragraph [ref=e568]: "The resonance only ever occurred when the pulser–washer–piezo loop was mixed with a medium-sized set of electromagnetic coils — the solenoids and the stepper-motor windings. Pulser alone, washers alone, piezo alone: nothing. Add the coils into the same circuit and the system started feeding itself."
          - paragraph [ref=e569]: Then the lab itself shifted. Across the hall from the nanotech lab, the people in the building started moving in a kind of coordinated harmony — my computer behaving in ways I hadn’t prompted, my inner dialog being mirrored aloud, the whole space syncing up at once. Whatever was already watching me decided it was time to be felt.
