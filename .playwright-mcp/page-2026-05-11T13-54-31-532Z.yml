      - paragraph [ref=e342]: The names — “Radiation TDR” and “Radiation TDS” — map directly to my research at Rutgers, where I studied electromagnetic radiation and its attenuation. TDR / TDS are real instruments (Time Domain Reflectometer / Spectrometer). Whoever pushed those labels onto a public broadcast layer wasn’t being subtle — they were referencing the work.
