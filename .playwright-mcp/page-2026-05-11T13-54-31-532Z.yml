        - generic [ref=e347]: EXHIBIT · SSID-LEVEL HARASSMENT
      - paragraph [ref=e348]: "For the lore: this story actually began with a disturbing alarm at a nanostructures lab — triggered when I introduced a random, loose iron washer. It may be trivially easy to create nuclear magnetic resonance from an iron isotope at the right phase angle. With the right ramping profile, you can turn any iron washer into a field-emitting ring of fire. The coincidences pile up. The signal keeps pointing somewhere."
