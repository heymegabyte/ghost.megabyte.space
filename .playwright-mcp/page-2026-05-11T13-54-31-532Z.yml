        - paragraph [ref=e1005]:
          - text: It started with WTC2001. One plate in Parsippany — and the world cracked open. After that, the plates didn’t stop. Maybe I over-fixated. Maybe the over-fixation is the point. Because what really
          - emphasis [ref=e1006]: was
          - text: 9/11? JFK gets shot the year after signing Executive Order 11110 to drain the Federal Reserve, and then thirty-eight years later the Twin Towers come down alongside Building 7. Coincidence is a word people use when they don’t want to count.
        - paragraph [ref=e1007]: What follows is six-plus years of license plates and rolling vehicles — vanity plates, work trucks, motorcycles, every kind of message the road throws back. Each one a moment. Some are funny. Some are pointed. All of them showed up at the right time.
