  - id: avatar-mud-era
    date: "2010-01-01T00:00:00Z"
    title: "AVATAR MUD"
    body: "Teenage internet life and the first rupture. Internet relationships, strangers appearing too close to home. When I was fourteen, people I only knew from the internet threw a convention in my own town — screen names suddenly walking the same streets I did. I made a song about how that felt. The earliest confusion traces back here."
    category: narrative
    severity: 2
    image: "/middle-earth-map.webp"
    imageAlt: "Hand-drawn fantasy realm map — the kind of world a text MUD renders in prose"
    imageCaption: "AVATAR MUD · outland.org"

